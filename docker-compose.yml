services:
  worker:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-ai_hub_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-ai_learning_hub_db}
      - MINIO_ENDPOINT=minio:9000
      - QDRANT_HOST=qdrant
    networks:
      - hub-network
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

networks:
  hub-network:
    external: true
    name: hub-network
