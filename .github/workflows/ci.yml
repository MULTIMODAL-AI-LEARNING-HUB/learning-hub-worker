name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dev dependencies
        # requirements-dev.txt is intentionally lightweight (no torch / sentence-transformers)
        # so this step completes in seconds instead of minutes.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: pytest tests/

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: registry.heroku.com/${{ secrets.HEROKU_APP_NAME_WORKER }}/worker

      - name: Push Docker image to Heroku
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME_WORKER }}/worker

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release Heroku Container
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku stack:set container --app ${{ secrets.HEROKU_APP_NAME_WORKER }}
          heroku container:release worker --app ${{ secrets.HEROKU_APP_NAME_WORKER }} || {
            echo "========================================="
            echo "Release failed! Fetching Heroku release logs..."
            echo "========================================="
            heroku releases --app ${{ secrets.HEROKU_APP_NAME_WORKER }} -n 5
            heroku logs --app ${{ secrets.HEROKU_APP_NAME_WORKER }} -n 100
            exit 1
          }

      - name: Health Check
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "Waiting for worker to start..."
          sleep 10
          echo "Checking worker status..."
          heroku ps --app ${{ secrets.HEROKU_APP_NAME_WORKER }}
          WORKER_STATUS=$(heroku ps --app ${{ secrets.HEROKU_APP_NAME_WORKER }} | grep -c "worker" || true)
          if [ "$WORKER_STATUS" -gt 0 ]; then
            echo "Worker is running!"
          else
            echo "Warning: No worker dyno found. Logs:"
            heroku logs --app ${{ secrets.HEROKU_APP_NAME_WORKER }} -n 50
          fi
